<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 个人记事本</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 顶部导航栏 -->
    <header class="header">
      <h1 class="logo">📝 记事本</h1>
      <div class="header-actions">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索笔记..." />
        </div>
        <button class="btn btn-primary" id="newNoteBtn">+ 新建笔记</button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 笔记列表 -->
      <div class="notes-container">
        <div class="notes-count" id="notesCount">加载中...</div>
        <div class="notes-grid" id="notesGrid">
          <!-- 笔记卡片动态渲染 -->
        </div>
        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
          <div class="empty-icon">📭</div>
          <p>还没有笔记</p>
          <p class="empty-hint">点击「新建笔记」开始记录吧</p>
        </div>
      </div>
    </main>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle">新建笔记</h2>
          <button class="btn-icon" id="modalClose">&times;</button>
        </div>
        <div class="modal-body">
          <input
            type="text"
            class="input-title"
            id="noteTitle"
            placeholder="笔记标题"
            maxlength="255"
            autofocus
          />
          <textarea
            class="input-content"
            id="noteContent"
            placeholder="写点什么..."
          ></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelBtn">取消</button>
          <button class="btn btn-primary" id="saveBtn">保存</button>
        </div>
      </div>
    </div>

    <!-- 定位小地图（高德地图） -->
    <div class="map-panel" id="mapPanel">
      <div class="map-panel-header">
        <span class="map-panel-title">📍 我的定位</span>
        <button class="btn-icon map-toggle" id="mapToggle" title="收起/展开地图">−</button>
      </div>
      <div class="map-container" id="mapContainer"></div>
      <div class="map-status" id="mapStatus">正在获取定位...</div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="deleteOverlay">
      <div class="modal modal-small">
        <div class="modal-header">
          <h2>确认删除</h2>
          <button class="btn-icon" id="deleteClose">&times;</button>
        </div>
        <div class="modal-body">
          <p>确定要删除这条笔记吗？此操作不可撤销。</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="deleteCancelBtn">取消</button>
          <button class="btn btn-danger" id="deleteConfirmBtn">删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 高德地图 JS API 2.0 -->
  <!-- ⚠️ 请到高德开放平台 https://lbs.amap.com 申请「Web端(JS API)」类型的 key，
       将下面 key= 后面的占位符替换为你自己的 key，地图才能正常显示 -->
  <script src="https://webapi.amap.com/maps?v=2.0&key=9df3116b85bb5bcb9d96228c56ca2581"></script>
  <script src="app.js"></script>
  <script src="map.js"></script>
</body>
</html>
